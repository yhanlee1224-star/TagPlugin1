name: TagGame
version: 1.1.0
main: kr.ep1.tag.TagPlugin
api-version: '26.2'
description: ep.1 술래잡기
commands:
  시작:
    description: 술래잡기 시작
    aliases: [tagstart]
    permission: tag.admin
  중지:
    description: 술래잡기 중지
    aliases: [tagstop]
    permission: tag.admin
permissions:
  tag.admin:
    description: 술래잡기 시작/중지
    default: op
